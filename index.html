  <body>
    <header>
      <nav>
        <div class="logo">ScaleX</div>
        <ul class="links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Blogs</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>

    <main>

          <div class="card-content">
            <span>Tech</span>
            <h2>The Ultimate Guide To SaaS Marketing</h2>

            <span>SaaS</span>
            <h2>5 Key Trends In SaaS Growth For 2025</h2>
            <p>May 23,2025</p>
          </div>
        </div>
        <div class="card">
          <div class="card-image">
            <img src="./marketing.png" alt="Marketing analytics illustration" />
          </div>
          <div class="card-content">
            <span>Marketing</span>
            <h2>How Data-Driven Strategies Are Important</h2>
            <p>May 23,2025</p>
